name: Deploy Producao (S3, CloudFront & Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Files to S3
        run: |
          BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}"
          if [ -z "$BUCKET_NAME" ]; then
            echo "S3_BUCKET_NAME secret não configurado, buscando via Terraform outputs..."
            cd terraform && terraform init -input=false && BUCKET_NAME=$(terraform output -raw s3_bucket_name) && cd ..
          fi
          echo "Sincronizando arquivos no bucket s3://$BUCKET_NAME ..."

          # 1. Arquivos HTML sem cache longo
          aws s3 sync . s3://$BUCKET_NAME \
            --exclude "*" \
            --include "*.html" \
            --include "admin/*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          # 2. Arquivos CSS e JS
          aws s3 sync . s3://$BUCKET_NAME \
            --exclude "*" \
            --include "*.css" \
            --include "*.js" \
            --include "*.mjs" \
            --cache-control "public, max-age=31536000, immutable"

          # 3. Imagens e Fontes
          aws s3 sync . s3://$BUCKET_NAME \
            --exclude "*" \
            --include "*.svg" \
            --include "*.png" \
            --include "*.webp" \
            --include "*.woff2" \
            --include "fotos/*" \
            --include "fontes/*" \
            --cache-control "public, max-age=31536000, immutable"

          # 4. Outros assets (ex: LEIA-ME, headers)
          aws s3 cp _headers s3://$BUCKET_NAME/_headers --cache-control "public, max-age=0, must-revalidate" || true
          aws s3 cp favicon.svg s3://$BUCKET_NAME/favicon.svg --cache-control "public, max-age=31536000, immutable" || true

  deploy-backend:
    name: Terraform Apply (Lambda & CloudFront)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Terraform Apply (Lambda & CloudFront)
        working-directory: terraform
        env:
          TF_VAR_infinitepay_api_key: ${{ secrets.INFINITEPAY_API_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL || 'https://xhtnhhdpiuqdquacooau.supabase.co' }}
          TF_VAR_site_url: ${{ secrets.SITE_URL || 'https://acampamentoipi.com.br' }}
        run: |
          echo "Inicializando Terraform com backend remoto S3..."
          terraform init
          echo "Aplicando plano de infraestrutura e atualizando a Lambda..."
          terraform apply -auto-approve -input=false

  invalidate-cache:
    name: Invalidate CloudFront Cache
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Invalidate CloudFront
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DIST_ID" ]; then
            cd terraform && DIST_ID=$(terraform output -raw cloudfront_distribution_id) && cd ..
          fi
          echo "Criando invalidacao global no CloudFront: $DIST_ID"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
