<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imersos · Painel da organização</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="../apple-touch-icon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF2F0; --surface:#FFFFFF; --ink:#0F2A33; --muted:#566C72; --line:#D0DFDB;
  --water:#16707C; --water-2:#0E5762; --water-soft:#CCE5E4;
  --sun:#D99A00; --sun-soft:#FBEBC2; --coral:#C0442D; --coral-soft:#F7DAD3;
  --ok:#2C7A4C; --ok-soft:#D4EBDC; --on-water:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B20; --surface:#122830; --ink:#E4EFED; --muted:#92A9AD; --line:#244149;
    --water:#4FB2BE; --water-2:#7BC9D2; --water-soft:#163C43;
    --sun:#F0BD3D; --sun-soft:#3B3114; --coral:#EE8670; --coral-soft:#42221B;
    --ok:#6CC28F; --ok-soft:#183627; --on-water:#06252B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B20; --surface:#122830; --ink:#E4EFED; --muted:#92A9AD; --line:#244149;
  --water:#4FB2BE; --water-2:#7BC9D2; --water-soft:#163C43;
  --sun:#F0BD3D; --sun-soft:#3B3114; --coral:#EE8670; --coral-soft:#42221B;
  --ok:#6CC28F; --ok-soft:#183627; --on-water:#06252B;
  color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--water)}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--water);color:var(--on-water)}
.top-inner{max-width:980px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-0.02em}
.brand small{opacity:.85;font-size:14px}
.sync{font-size:12px;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:inherit;opacity:.78;padding:10px 12px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--sun)}

main{max-width:980px;margin:0 auto;padding:18px 18px 60px}
.banner{background:var(--sun-soft);border-left:4px solid var(--sun);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
section[hidden]{display:none}

/* Resumo */
.lake{background:var(--surface);border-radius:18px;padding:20px;border:1px solid var(--line)}
.lake-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lake-head p{margin:0;color:var(--muted);font-size:14px}
.lake-value{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.tank{position:relative;height:56px;border-radius:12px;background:var(--water-soft);margin:18px 0 8px;overflow:hidden}
.tank-fill{position:absolute;inset:0 auto 0 0;background:var(--water);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.tank-fill::after{content:"";position:absolute;right:-10px;top:0;bottom:0;width:20px;background:radial-gradient(circle at 0 50%,var(--water) 9px,transparent 10px) 0 0/20px 14px repeat-y}
.tank-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700;font-size:14px}
.tank-label span:first-child{color:var(--on-water);mix-blend-mode:normal}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.tank-fill{transition:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat h3{font-size:15px;font-weight:700;margin-bottom:6px}
.stat .big{font-size:24px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.stat .sub{font-size:13px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.block{margin-top:22px}
.block h2{font-size:21px;margin-bottom:10px}
.block .hint{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px}

.flow-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.flow-row:last-child{border-bottom:0}
.flow-month{font-weight:700;font-size:14px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:10px;border-radius:5px;min-width:2px}
.bar.in{background:var(--water)} .bar.out{background:var(--coral)}
.flow-vals{text-align:right;font-size:13px;line-height:1.35;white-space:nowrap}
.flow-vals .in{color:var(--water)} .flow-vals .out{color:var(--coral)}
.flow-vals .bal{font-weight:700}

.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cat-row:last-child{border-bottom:0}
.cat-track{grid-column:1/-1;height:8px;background:var(--water-soft);border-radius:4px;overflow:hidden}
.cat-track div{height:100%;background:var(--sun)}

/* Listas */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.item:hover{border-color:var(--water)}
.item .name{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);grid-column:1/2}
.item .right{text-align:right;grid-row:1/3;grid-column:2/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .amount{font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pago,.pill.recebido{background:var(--ok-soft);color:var(--ok)}
.pill.parcial{background:var(--sun-soft);color:var(--ink)}
.pill.pendente,.pill.previsto{background:var(--water-soft);color:var(--ink)}
.pill.atrasado{background:var(--coral-soft);color:var(--coral)}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--water);color:var(--on-water)}
.btn:hover{background:var(--water-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--water)}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.totals b{color:var(--ink)}

/* Formulários */
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
label > input,label > select,label > textarea{margin-top:5px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:22px;min-height:22px;height:22px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.form-actions .spacer{flex:1}
.note{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.err{color:var(--coral);font-size:14px;font-weight:600;min-height:1em;margin:0 0 6px}

dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,25,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:21px}
.dlg-body{padding:16px 18px 18px}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted)}

.parc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.parc:last-child{border-bottom:0}
.parc .pt{font-weight:700}
.parc .pd{font-size:13px;color:var(--muted)}
.parc-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.parc-actions input{width:120px;min-height:36px;padding:6px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.opt{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.opt-grid{display:grid;grid-template-columns:2fr 1fr 1.4fr 1.6fr auto;gap:8px;align-items:end}
.opt-grid label{margin:0}
@media (max-width:640px){
  .opt-grid{grid-template-columns:1fr 1fr}
  .opt-grid .del{grid-column:1/-1}
  .lake-value{font-size:34px}
  .flow-row{grid-template-columns:56px 1fr auto}
}
#login{position:fixed;inset:0;z-index:40;background:var(--water);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lg-card{background:var(--surface);border-radius:18px;padding:26px 24px;width:min(380px,100%)}
.lg-card h1{font-size:36px;font-weight:800;letter-spacing:-0.02em}
.lg-card > p{color:var(--muted);margin:4px 0 20px}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.preview{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:12px}
.preview table{border-collapse:collapse;width:100%}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
</style>
</head>
<body>
<div id="login" hidden><div class="lg-card"><h1>Imersos</h1><p>Painel da organização</p>
  <label>Usuário<input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: mateus"></label>
  <label>Senha<input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()"></label>
  <p class="err" id="lgErr"></p>
  <button class="btn" id="lgBtn" onclick="fazerLogin()" style="width:100%">Entrar</button></div></div>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div><h1 id="evNome">Imersos</h1><small id="evSub">Acampamento de Carnaval 2027</small></div>
      <div class="hdr-actions"><span class="sync" id="sync">Carregando…</span><button class="hbtn" onclick="carregar()">Atualizar</button><button class="hbtn" onclick="sair()">Sair</button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="resumo" aria-selected="true">Resumo</button>
      <button class="tab" role="tab" data-tab="acampantes" aria-selected="false">Acampantes</button>
      <button class="tab" role="tab" data-tab="gastos" aria-selected="false">Gastos</button>
      <button class="tab" role="tab" data-tab="entradas" aria-selected="false">Outras entradas</button>
      <button class="tab" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </div>
</header>

<main>
  <div id="banner"></div>

  <section id="sec-resumo"></section>
  <section id="sec-acampantes" hidden></section>
  <section id="sec-gastos" hidden></section>
  <section id="sec-entradas" hidden></section>
  <section id="sec-ajustes" hidden></section>
</main>

<dialog id="dlg"><div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" aria-label="Fechar" onclick="closeDlg()">×</button></div><div class="dlg-body" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = c => ((c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const moneyIn = c => c ? (c/100).toFixed(2).replace(".",",") : "";
function parseMoney(s){
  s = String(s||"").replace(/R\$|\s/g,"");
  if(!s) return 0;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const v = parseFloat(s);
  return isNaN(v) ? NaN : Math.round(v*100);
}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const fmtDate = iso => iso ? iso.split("-").reverse().join("/") : "sem data";
function addMonths(iso,k){
  const [y,m,d]=iso.split("-").map(Number);
  const t=new Date(y,m-1+k,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,last));
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const monthLabel = k => {const [y,m]=k.split("-");return MESES[+m-1]+"/"+y.slice(2)};
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const sum = (arr,f) => arr.reduce((a,x)=>a+(f(x)||0),0);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}

const CAT_GASTOS=["Local (chácara)","Transporte","Alimentação","Limpeza","Material e decoração","Som e mídia","Camisetas e brindes","Seguro","Outros"];
const CAT_ENTRADAS=["Ofertas","Doações","Cantina","Patrocínio","Bazar","Outros"];
const DEFAULT_CONFIG={nome:"Imersos",subtitulo:"Acampamento de Carnaval 2027",dataInicio:"",dataFim:"",local:"",vagas:0,whatsapp:"",
  opcoes:[{id:"avista",nome:"PIX à vista",parcelas:1,valor:45000,primeiroVenc:""},{id:"p2",nome:"PIX em 2 parcelas",parcelas:2,valor:45000,primeiroVenc:""},{id:"p3",nome:"PIX em 3 parcelas",parcelas:3,valor:45000,primeiroVenc:""}]};

/* ---------- Estado e dados ---------- */
const SUPABASE_URL="https://xhtnhhdpiuqdquacooau.supabase.co";
const SUPABASE_KEY="sb_publishable_stUBkyPTyqHtCla_seKJRw_k_LW2S_i";
const DOMINIO="@imersos.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const S={config:structuredClone(DEFAULT_CONFIG),acampantes:[],despesas:[],entradas:[],tab:"resumo",filtro:"todos",busca:"",readOnly:false};
const MAP={
  acampantes:{
    toDb:a=>({nome:a.nome,telefone:a.telefone||null,email:a.email||null,idade:a.idade||null,responsavel:a.responsavel||null,responsavel_tel:a.responsavelTel||null,opcao_id:a.opcaoId||null,opcao_nome:a.opcaoNome||null,obs:a.obs||null,parcelas:a.parcelas||[],codigo:a.codigo||null,nascimento:a.nascimento||null,camiseta:a.camiseta||null,lote:a.lote||null,origem:a.origem||"painel"}),
    fromDb:r=>({id:r.id,nome:r.nome,telefone:r.telefone||"",email:r.email||"",idade:r.idade,responsavel:r.responsavel||"",responsavelTel:r.responsavel_tel||"",opcaoId:r.opcao_id,opcaoNome:r.opcao_nome||"",obs:r.obs||"",parcelas:r.parcelas||[],criadoEm:r.criado_em,codigo:r.codigo||"",nascimento:r.nascimento||"",camiseta:r.camiseta||"",lote:r.lote||"",origem:r.origem||""})},
  despesas:{
    toDb:d=>({descricao:d.descricao,categoria:d.categoria,valor:d.valor,data:d.data||null,pago:!!d.pago,fornecedor:d.fornecedor||null,obs:d.obs||null}),
    fromDb:r=>({id:r.id,descricao:r.descricao,categoria:r.categoria||"Outros",valor:r.valor,data:r.data||"",pago:r.pago,fornecedor:r.fornecedor||"",obs:r.obs||""})},
  entradas:{
    toDb:e=>({descricao:e.descricao,categoria:e.categoria,valor:e.valor,data:e.data||null,recebido:!!e.recebido,obs:e.obs||null}),
    fromDb:r=>({id:r.id,descricao:r.descricao,categoria:r.categoria||"Outros",valor:r.valor,data:r.data||"",recebido:r.recebido,obs:r.obs||""})}
};
const strip = d => {const {id,...r}=d;return r};
const setSync = t => $("#sync").textContent=t;

async function carregar(){
  setSync("Atualizando…");
  const [c,a,d,e]=await Promise.all([
    sb.from("config").select("dados").eq("id",1).maybeSingle(),
    sb.from("acampantes").select("*"), sb.from("despesas").select("*"), sb.from("entradas").select("*")]);
  const err=c.error||a.error||d.error||e.error;
  if(err){console.error(err);setSync("Erro ao carregar");toast("Não foi possível carregar os dados. Confira a internet.");return}
  if(c.data&&c.data.dados&&Object.keys(c.data.dados).length) S.config={...structuredClone(DEFAULT_CONFIG),...c.data.dados};
  S.acampantes=a.data.map(MAP.acampantes.fromDb); S.despesas=d.data.map(MAP.despesas.fromDb); S.entradas=e.data.map(MAP.entradas.fromDb);
  const cp=await sb.from("cupons").select("*").order("criado_em");
  S.cupons=cp.error?null:cp.data; if(cp.error) console.warn(cp.error);
  setSync("Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  renderAll();
}
async function saveDoc(col,id,data){
  if(col==="config"){
    S.config={...data}; renderAll();
    const {error}=await sb.from("config").update({dados:data,atualizado_em:new Date().toISOString()}).eq("id",1);
    if(error) falhou(error); return;

  if(error) falhou(error);
}

/* ---------- Regras de pagamento ---------- */
function gerarParcelas(total,n,primeiro,jaPago=0){
  n=Math.max(1,n|0); const base=Math.floor(total/n); const venc0=primeiro||todayISO();
  const ps=[]; for(let i=0;i<n;i++){ps.push({n:i+1,valor:i===n-1?total-base*(n-1):base,venc:addMonths(venc0,i),pago:0,dataPag:""})}
  let resto=jaPago; for(const p of ps){const v=Math.min(resto,p.valor);p.pago=v;if(v>0)p.dataPag=todayISO();resto-=v}
  if(resto>0) ps[ps.length-1].pago+=resto;
  return ps;
}
function statusParcela(p){ if(p.valor>0&&p.pago>=p.valor) return "pago"; if(p.venc&&p.venc<todayISO()) return "atrasado"; if(p.pago>0) return "parcial"; return "pendente"; }
function totais(a){const total=sum(a.parcelas||[],p=>p.valor),pago=sum(a.parcelas||[],p=>p.pago);return{total,pago,falta:Math.max(0,total-pago)}}
function statusAcampante(a){
  const {total,pago}=totais(a);
  if(total>0&&pago>=total) return "pago";
  if((a.parcelas||[]).some(p=>statusParcela(p)==="atrasado")) return "atrasado";
  if(pago>0) return "parcial";
  return "pendente";
}
const ROTULO={pago:"Pago",parcial:"Parcial",pendente:"Pendente",atrasado:"Atrasado",recebido:"Recebido",previsto:"Previsto"};
const pill = s => `<span class="pill ${s}">${ROTULO[s]}</span>`;
const opcaoById = id => S.config.opcoes.find(o=>o.id===id);
function waLink(tel,msg){const d=String(tel||"").replace(/\D/g,"");if(d.length<10)return"";const n=d.length<=11?"55"+d:d;return`https://wa.me/${n}?text=${encodeURIComponent(msg)}`}

function renderAll(){
  $("#evNome").textContent=S.config.nome||"Acampamento";
  const dt = S.config.dataInicio ? fmtDate(S.config.dataInicio)+(S.config.dataFim?" a "+fmtDate(S.config.dataFim):"") : "";
  $("#evSub").textContent=[S.config.subtitulo,dt,S.config.local].filter(Boolean).join(", ");
  renderResumo(); renderAcampantes(); renderLista("despesas"); renderLista("entradas"); renderAjustes();
}

function calc(){
  const A=S.acampantes, D=S.despesas, E=S.entradas;
  const recPrev=sum(A,a=>totais(a).total), recRec=sum(A,a=>totais(a).pago);
  const entPrev=sum(E,e=>e.valor), entRec=sum(E,e=>e.recebido?e.valor:0);
  const despPrev=sum(D,d=>d.valor), despPago=sum(D,d=>d.pago?d.valor:0);
  const st={pago:0,parcial:0,pendente:0,atrasado:0}; A.forEach(a=>st[statusAcampante(a)]++);
  const valoresOp=S.config.opcoes.map(o=>o.valor).filter(v=>v>0);
  const media = A.length&&recPrev ? recPrev/A.length : (valoresOp.length? Math.min(...valoresOp):0);
  const precisa = Math.max(0,despPrev-entPrev);
  const minInscritos = media>0 ? Math.ceil(precisa/media) : null;
  return {recPrev,recRec,entPrev,entRec,despPrev,despPago,st,media,minInscritos,
    saldoHoje:recRec+entRec-despPago, saldoProj:recPrev+entPrev-despPrev};
}

function renderResumo(){
  const c=calc(), A=S.acampantes;
  const entTotal=c.recPrev+c.entPrev, entJa=c.recRec+c.entRec;
  const pct = entTotal>0 ? Math.min(100,Math.round(entJa/entTotal*100)) : 0;
  const semValor = S.config.opcoes.every(o=>!o.valor);
  let h = semValor ? `<div class="banner">Os valores da inscrição ainda não foram definidos. Preencha em <a href="#" onclick="goTab('ajustes');return false">Ajustes</a> para o sistema calcular as parcelas.</div>`:"";
  h+=`<div class="lake">
    <div class="lake-head"><div><p>Saldo previsto ao fim do acampamento</p><div class="lake-value" style="color:${c.saldoProj<0?"var(--coral)":"var(--ink)"}">${fmt(c.saldoProj)}</div></div>
    <div style="text-align:right"><p>Em caixa hoje</p><div style="font-size:22px;font-weight:700">${fmt(c.saldoHoje)}</div></div></div>
    <div class="tank" role="img" aria-label="${pct}% das entradas previstas já recebidas"><div class="tank-fill" style="width:${pct}%"></div>
      <div class="tank-label"><span>${pct}% recebido</span><span>${fmt(entTotal-entJa)} a receber</span></div></div>
    <div class="legend"><span>Já entrou ${fmt(entJa)}</span><span>Total previsto ${fmt(entTotal)}</span></div>
  </div>
  <div class="grid">
    <div class="stat"><h3>Acampantes</h3><div class="big">${A.length}${S.config.vagas?` <span class="sub">de ${S.config.vagas} vagas</span>`:""}</div>
      <div class="counts">${c.st.pago?`<span class="pill pago">${c.st.pago} pagos</span>`:""}${c.st.parcial?`<span class="pill parcial">${c.st.parcial} parciais</span>`:""}${c.st.pendente?`<span class="pill pendente">${c.st.pendente} pendentes</span>`:""}${c.st.atrasado?`<span class="pill atrasado">${c.st.atrasado} atrasados</span>`:""}</div></div>
    <div class="stat"><h3>Inscrições</h3><div class="big">${fmt(c.recRec)}</div><div class="sub">recebido de ${fmt(c.recPrev)}</div></div>
    <div class="stat"><h3>Outras entradas</h3><div class="big">${fmt(c.entRec)}</div><div class="sub">recebido de ${fmt(c.entPrev)}</div></div>
    <div class="stat"><h3>Gastos</h3><div class="big">${fmt(c.despPrev)}</div><div class="sub">${fmt(c.despPago)} já pago</div></div>
    <div class="stat"><h3>Ponto de equilíbrio</h3>${c.minInscritos===null?`<div class="sub">Defina os valores da inscrição para calcular.</div>`:
      `<div class="big">${c.minInscritos} inscritos</div><div class="sub">${c.minInscritos<=A.length?"Gastos cobertos pelas inscrições atuais":`faltam ${c.minInscritos-A.length} para cobrir os gastos`}</div>`}</div>
  </div>`;

  // Fluxo mensal
  const m={}; const add=(iso,k,v)=>{const key=(iso||todayISO()).slice(0,7);m[key]=m[key]||{in:0,out:0};m[key][k]+=v};
  A.forEach(a=>(a.parcelas||[]).forEach(p=>add(p.venc,"in",p.valor)));
  S.entradas.forEach(e=>add(e.data,"in",e.valor)); S.despesas.forEach(d=>add(d.data,"out",d.valor));
  const keys=Object.keys(m).sort(); const max=Math.max(1,...keys.map(k=>Math.max(m[k].in,m[k].out)));
  let acc=0;
  h+=`<div class="block"><h2>Fluxo por mês</h2><p class="hint">Entradas previstas pelas parcelas e outras entradas, contra os gastos de cada mês.</p>`;
  h+= keys.length? `<div class="panel">`+keys.map(k=>{acc+=m[k].in-m[k].out;return`<div class="flow-row"><div class="flow-month">${monthLabel(k)}</div>
    <div class="bars"><div class="bar in" style="width:${m[k].in/max*100}%"></div><div class="bar out" style="width:${m[k].out/max*100}%"></div></div>
    <div class="flow-vals"><div class="in">+ ${fmt(m[k].in)}</div><div class="out">− ${fmt(m[k].out)}</div><div class="bal">saldo ${fmt(acc)}</div></div></div>`}).join("")+`</div>`
    : `<div class="empty"><strong>Nada previsto ainda</strong>O fluxo aparece quando houver inscritos ou gastos.</div>`;
  h+=`</div>`;

  // Gastos por categoria
  const cat={}; S.despesas.forEach(d=>cat[d.categoria]=(cat[d.categoria]||0)+d.valor);
  const ck=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);
  if(ck.length){ const cm=cat[ck[0]];
    h+=`<div class="block"><h2>Gastos por categoria</h2><div class="panel">`+ck.map(k=>`<div class="cat-row"><span>${esc(k)}</span><b>${fmt(cat[k])}</b><div class="cat-track"><div style="width:${cat[k]/cm*100}%"></div></div></div>`).join("")+`</div></div>`;

  // Cobranças
  const lim=addMonths(todayISO(),0); const em15=new Date(); em15.setDate(em15.getDate()+15);
  const ate=em15.toISOString().slice(0,10);
  const cob=[]; A.forEach(a=>(a.parcelas||[]).forEach(p=>{const s=statusParcela(p);if(s!=="pago"&&p.venc&&p.venc<=ate)cob.push({a,p,s})}));

  h+= cob.length? `<div class="list">`+cob.slice(0,12).map(({a,p,s})=>`<button class="item" onclick="abrirAcampante('${a.id}')"><span class="name">${esc(a.nome)}</span>

    : `<div class="empty"><strong>Tudo em dia</strong>Nenhuma parcela atrasada ou vencendo nos próximos 15 dias.</div>`;
  h+=`</div>`;
  $("#sec-resumo").innerHTML=h;
}

async function addCupom(){
  const codigo=normCod($("#cpCod").value), igreja=$("#cpIgr").value.trim(), tipo=$("#cpTipo").value, raw=$("#cpVal").value;
  const err=t=>$("#cpErr").textContent=t;
  if(codigo.length<3) return err("O código precisa ter pelo menos 3 letras ou números.");
  if(!igreja) return err("Informe o nome da igreja.");
  let valor = tipo==="percent" ? parseInt(String(raw).replace(/\D/g,"")) : parseMoney(raw);
  if(!valor||isNaN(valor)||valor<0) return err(tipo==="percent"?"Digite a porcentagem, ex.: 50.":"Digite o valor, ex.: 400,00.");
  if(tipo==="percent"&&valor>100) return err("A porcentagem vai de 1 a 100.");
  if(S.cupons.some(c=>c.codigo===codigo)) return err("Já existe um cupom com esse código.");
  const row={codigo,igreja,tipo,valor,validade:$("#cpVal2").value||null,ativo:true};
  const {data,error}=await sb.from("cupons").insert(row).select().single();
  if(error){console.error(error);return err("Não foi possível salvar o cupom. Tente de novo.")}
  S.cupons.push(data); document.activeElement?.blur(); renderAjustes(); toast("Cupom "+codigo+" criado");
}

  if(error)return falhou(error); c.ativo=!c.ativo; document.activeElement?.blur(); renderAjustes(); toast(c.ativo?"Cupom ativado":"Cupom pausado")}

/* Reparte o que falta do total entre as parcelas em aberto (valores em centavos) */
function redistribuir(ps,total){
  const aberto=ps.filter(p=>!(p.valor>0&&p.pago>=p.valor));
  if(!aberto.length) return ps;
  const fechado=sum(ps.filter(p=>!aberto.includes(p)),p=>p.valor);
  let resta=total-fechado;
  if(resta<=0){ const fic=ps.filter(p=>!aberto.includes(p)); fic.forEach((p,k)=>p.n=k+1); return fic; }
  const base=Math.floor(resta/aberto.length); let sobra=resta-base*aberto.length;
  aberto.forEach((p,k)=>{ p.valor=base+(k===aberto.length-1?sobra:0); });
  return ps;
}
function desfazer(id,i){const a=S.acampantes.find(x=>x.id===id);const total=sum(a.parcelas,p=>p.valor);
  let ps=a.parcelas.map(p=>({...p}));ps[i].pago=0;ps[i].dataPag="";ps=redistribuir(ps,total);
  saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);toast("Pagamento desfeito e parcelas recalculadas")}
function parcial(id,i){const v=parseMoney($("#pp"+i).value);if(!v||isNaN(v)||v<0)return toast("Digite o valor pago, ex.: 125,00");
  const a=S.acampantes.find(x=>x.id===id);const total=sum(a.parcelas,p=>p.valor);let ps=a.parcelas.map(p=>({...p}));
  const p=ps[i];p.pago+=v;p.dataPag=todayISO();
  const outrasAbertas=ps.some((q,k)=>k!==i&&!(q.valor>0&&q.pago>=q.valor));
  if(!outrasAbertas){
    if(p.pago>p.valor)p.valor=p.pago;
    saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);
    const extra=sum(ps,q=>q.valor)-total;
    return toast(extra>0?`Registrado. A pessoa pagou ${fmt(extra)} a mais que o total`:"Pagamento registrado")}
  p.valor=p.pago;ps=redistribuir(ps,total);
  const extra=sum(ps,q=>q.pago)-total;
  saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);
  toast(extra>0?`Registrado. A pessoa pagou ${fmt(extra)} a mais que o total`:"Pagamento registrado e parcelas recalculadas")}

/* ---------- Importação ---------- */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||""; const cand=[";",",","\t"]; const dl=cand.sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true; else if(ch===dl){row.push(cur);cur=""} else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""} else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function formImport(){
  openDlg("Importar inscrições",`<p class="note" style="margin:0 0 12px">Exporte as respostas do formulário (Google Forms, planilha) e cole aqui, com a linha de títulos. O sistema procura colunas de nome, telefone ou WhatsApp, idade, responsável e forma de pagamento.</p>
    <label>Dados copiados da planilha<textarea id="iTxt" placeholder="Nome;WhatsApp;Forma de pagamento&#10;Ana Souza;(19) 99999-0000;3x"></textarea></label>
    <div id="iPrev"></div><p class="err" id="iErr"></p>
    <div class="form-actions"><button class="btn ghost" onclick="previewImport()">Conferir</button><button class="btn" id="iBtn" onclick="doImport()" disabled>Importar</button></div>`);
}
let IMPORT=[];
function matchOpcao(v){const n=norm(v);const ops=S.config.opcoes;if(!n)return ops[0];
  let o=ops.find(o=>norm(o.nome)===n)||ops.find(o=>n.includes(norm(o.nome))&&norm(o.nome).length>1);if(o)return o;
  if(n.includes("vista"))return ops.find(o=>o.parcelas===1)||ops[0];
  const m=n.match(/(\d+)\s*(x|vez|parc)/);if(m)return ops.find(o=>o.parcelas===+m[1])||ops[0];return ops[0]}
function previewImport(){
  const rows=parseCSV($("#iTxt").value); IMPORT=[]; $("#iErr").textContent="";
  if(rows.length<2) return $("#iErr").textContent="Cole a linha de títulos e pelo menos uma inscrição.";
  const H=rows[0].map(norm); const col=keys=>H.findIndex(h=>keys.some(k=>h.includes(k)));
  const ci={nome:col(["nome"]),tel:col(["whats","telefone","celular","fone"]),idade:col(["idade"]),resp:col(["respons"]),op:col(["pagamento","parcel","opcao","forma"])};
  if(ci.nome<0) return $("#iErr").textContent="Não achei uma coluna com “nome” nos títulos.";
  const existentes=new Set(S.acampantes.map(a=>norm(a.nome)));
  IMPORT=rows.slice(1).map(r=>{const o=matchOpcao(ci.op>=0?r[ci.op]:"");return{nome:(r[ci.nome]||"").trim(),telefone:ci.tel>=0?(r[ci.tel]||"").trim():"",idade:ci.idade>=0?parseInt(r[ci.idade])||null:null,responsavel:ci.resp>=0?(r[ci.resp]||"").trim():"",o}})
    .filter(x=>x.nome&&!existentes.has(norm(x.nome)));
  const dup=rows.length-1-IMPORT.length;
  $("#iPrev").innerHTML=IMPORT.length?`<div class="preview"><table><tr><th>Nome</th><th>WhatsApp</th><th>Pagamento</th></tr>${IMPORT.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.telefone)}</td><td>${esc(x.o.nome)}</td></tr>`).join("")}</table></div>`:"";
  if(dup>0) $("#iErr").textContent=`${dup} linha(s) ignorada(s): sem nome ou já cadastrada(s).`;
  $("#iBtn").disabled=!IMPORT.length; $("#iBtn").textContent=`Importar ${IMPORT.length} acampante(s)`;
}
async function doImport(){
  const n=IMPORT.length; $("#iBtn").disabled=true;
  for(const x of IMPORT){const o=x.o;await saveDoc("acampantes",newId(),{nome:x.nome,telefone:x.telefone,idade:x.idade,responsavel:x.responsavel,obs:"",origem:"importacao",opcaoId:o.id,opcaoNome:o.nome,parcelas:gerarParcelas(o.valor,o.parcelas,o.primeiroVenc||todayISO()),criadoEm:new Date().toISOString()})}

/* ---------- Exportação ---------- */
const csvCell = v => {const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const reais = c => ((c||0)/100).toFixed(2).replace(".",",");
function baixar(nome,linhas){
  const data="\ufeff"+linhas.map(r=>r.map(csvCell).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  const el=document.createElement("a"); el.href=url; el.download=nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500); toast("Arquivo baixado");
}
function exportAcampantes(){
  const L=[["Nome","WhatsApp","E-mail","Idade","Responsável","Forma","Total","Pago","Falta","Situação"]];
  S.acampantes.slice().sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome))).forEach(a=>{const t=totais(a);L.push([a.nome,a.telefone,a.email||"",a.idade||"",a.responsavel,a.opcaoNome,reais(t.total),reais(t.pago),reais(t.falta),ROTULO[statusAcampante(a)]])});
  baixar("acampantes.csv",L);
}
function exportFinanceiro(){
  const L=[["Tipo","Descrição","Categoria","Data","Valor","Situação"]];
  S.acampantes.forEach(a=>(a.parcelas||[]).forEach(p=>L.push(["Inscrição",`${a.nome} (parcela ${p.n}/${a.parcelas.length})`,"Inscrições",fmtDate(p.venc),reais(p.valor),ROTULO[statusParcela(p)]])));
  S.entradas.forEach(e=>L.push(["Entrada",e.descricao,e.categoria,fmtDate(e.data),reais(e.valor),e.recebido?"Recebido":"Previsto"]));
  S.despesas.forEach(d=>L.push(["Gasto",d.descricao,d.categoria,fmtDate(d.data),"-"+reais(d.valor),d.pago?"Pago":"Previsto"]));
  baixar("financeiro.csv",L);
}

/* ---------- Navegação ---------- */
function goTab(t){S.tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="sec-"+t);window.scrollTo({top:0})}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.tab)));
init();
</script>
