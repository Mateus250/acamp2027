<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imersos · Painel da organização</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#EAF2F0; --surface:#FFFFFF; --ink:#0F2A33; --muted:#566C72; --line:#D0DFDB;
  --water:#16707C; --water-2:#0E5762; --water-soft:#CCE5E4;
  --sun:#D99A00; --sun-soft:#FBEBC2; --coral:#C0442D; --coral-soft:#F7DAD3;
  --ok:#2C7A4C; --ok-soft:#D4EBDC; --on-water:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B20; --surface:#122830; --ink:#E4EFED; --muted:#92A9AD; --line:#244149;
    --water:#4FB2BE; --water-2:#7BC9D2; --water-soft:#163C43;
    --sun:#F0BD3D; --sun-soft:#3B3114; --coral:#EE8670; --coral-soft:#42221B;
    --ok:#6CC28F; --ok-soft:#183627; --on-water:#06252B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B20; --surface:#122830; --ink:#E4EFED; --muted:#92A9AD; --line:#244149;
  --water:#4FB2BE; --water-2:#7BC9D2; --water-soft:#163C43;
  --sun:#F0BD3D; --sun-soft:#3B3114; --coral:#EE8670; --coral-soft:#42221B;
  --ok:#6CC28F; --ok-soft:#183627; --on-water:#06252B;
  color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--water)}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--water);color:var(--on-water)}
.top-inner{max-width:980px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-0.02em}
.brand small{opacity:.85;font-size:14px}
.sync{font-size:12px;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:inherit;opacity:.78;padding:10px 12px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--sun)}

main{max-width:980px;margin:0 auto;padding:18px 18px 60px}
.banner{background:var(--sun-soft);border-left:4px solid var(--sun);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
section[hidden]{display:none}

/* Resumo e Caixa */
.lake{background:var(--surface);border-radius:18px;padding:20px;border:1px solid var(--line)}
.lake-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lake-head p{margin:0;color:var(--muted);font-size:14px}
.lake-value{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.tank{position:relative;height:56px;border-radius:12px;background:var(--water-soft);margin:18px 0 8px;overflow:hidden}
.tank-fill{position:absolute;inset:0 auto 0 0;background:var(--water);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.tank-fill::after{content:"";position:absolute;right:-10px;top:0;bottom:0;width:20px;background:radial-gradient(circle at 0 50%,var(--water) 9px,transparent 10px) 0 0/20px 14px repeat-y}
.tank-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700;font-size:14px}
.tank-label span:first-child{color:var(--on-water);mix-blend-mode:normal}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.tank-fill{transition:none}}

/* Destaque Financeiro - Valores que Já Entraram vs Pendente */
.fin-hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px}
.fin-hero-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fin-hero-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ok)}
.fin-val-ja{font-size:40px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;color:var(--ok);letter-spacing:-0.03em;line-height:1;margin-top:6px}
.fin-sub-ja{font-size:13px;color:var(--muted);margin-top:4px}
.fin-pendente-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:right}
.fin-pendente-lbl{font-size:12px;color:var(--muted)}
.fin-pendente-val{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px}

/* Grid de Gráficos */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:18px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column}
.chart-card h3{font-size:17px;font-weight:700;margin:0 0 4px}
.chart-card .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.chart-wrap{position:relative;width:100%;height:220px;display:flex;align-items:center;justify-content:center}
.chart-stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.chart-stat-box{flex:1 1 110px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chart-stat-box .cs-val{font-size:20px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}
.chart-stat-box .cs-lbl{font-size:12px;color:var(--muted)}

/* Cupons equipantes tags */
.tag-box{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag-badge{background:var(--sun-soft);color:var(--ink);border:1px solid var(--sun);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-family:monospace}
.tag-badge .tag-del{background:none;border:none;padding:0;font-size:15px;line-height:1;cursor:pointer;color:inherit;opacity:.7}
.tag-badge .tag-del:hover{opacity:1;color:var(--coral)}
.tag-input-row{display:flex;gap:6px;margin-top:8px}
.tag-input-row input{height:36px;min-height:36px;padding:4px 10px;font-size:13px;font-family:monospace;text-transform:uppercase;max-width:180px}
.tag-input-row button{padding:4px 12px;font-size:13px;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat h3{font-size:15px;font-weight:700;margin-bottom:6px}
.stat .big{font-size:24px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.stat .sub{font-size:13px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.block{margin-top:22px}
.block h2{font-size:21px;margin-bottom:10px}
.block .hint{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px}

.flow-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.flow-row:last-child{border-bottom:0}
.flow-month{font-weight:700;font-size:14px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:10px;border-radius:5px;min-width:2px}
.bar.in{background:var(--water)} .bar.out{background:var(--coral)}
.flow-vals{text-align:right;font-size:13px;line-height:1.35;white-space:nowrap}
.flow-vals .in{color:var(--water)} .flow-vals .out{color:var(--coral)}
.flow-vals .bal{font-weight:700}

.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cat-row:last-child{border-bottom:0}
.cat-track{grid-column:1/-1;height:8px;background:var(--water-soft);border-radius:4px;overflow:hidden}
.cat-track div{height:100%;background:var(--sun)}

/* Listas */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.item:hover{border-color:var(--water)}
.item .name{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);grid-column:1/2}
.item .right{text-align:right;grid-row:1/3;grid-column:2/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .amount{font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pago,.pill.recebido{background:var(--ok-soft);color:var(--ok)}
.pill.parcial{background:var(--sun-soft);color:var(--ink)}
.pill.pendente,.pill.previsto{background:var(--water-soft);color:var(--ink)}
.pill.atrasado{background:var(--coral-soft);color:var(--coral)}
.pill.equipante{background:var(--sun-soft);color:var(--ink);border:1px solid var(--sun)}
.pill.acampante{background:var(--water-soft);color:var(--ink)}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--water);color:var(--on-water)}
.btn:hover{background:var(--water-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--water)}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.totals b{color:var(--ink)}

/* Formulários */
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
label > input,label > select,label > textarea{margin-top:5px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:22px;min-height:22px;height:22px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.form-actions .spacer{flex:1}
.note{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.err{color:var(--coral);font-size:14px;font-weight:600;min-height:1em;margin:0 0 6px}

dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,25,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:21px}
.dlg-body{padding:16px 18px 18px}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted)}

.parc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.parc:last-child{border-bottom:0}
.parc .pt{font-weight:700}
.parc .pd{font-size:13px;color:var(--muted)}
.parc-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.parc-actions input{width:120px;min-height:36px;padding:6px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.opt{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.opt-grid{display:grid;grid-template-columns:2fr 1fr 1.4fr 1.6fr auto;gap:8px;align-items:end}
.opt-grid label{margin:0}
@media (max-width:640px){
  .opt-grid{grid-template-columns:1fr 1fr}
  .opt-grid .del{grid-column:1/-1}
  .lake-value{font-size:32px}
  .fin-val-ja{font-size:32px}
  .flow-row{grid-template-columns:56px 1fr auto}
  .charts-grid{grid-template-columns:1fr}
}
#login{position:fixed;inset:0;z-index:40;background:var(--water);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lg-card{background:var(--surface);border-radius:18px;padding:26px 24px;width:min(380px,100%)}
.lg-card h1{font-size:36px;font-weight:800;letter-spacing:-0.02em}
.lg-card > p{color:var(--muted);margin:4px 0 20px}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.preview{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:12px}
.preview table{border-collapse:collapse;width:100%}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

/* ---------- Estilos da Aba Check-in ---------- */
.checkin-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.checkin-stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
}
.checkin-stat-card .csc-val {
  font-size: 28px;
  font-weight: 800;
  font-family: "Bricolage Grotesque", sans-serif;
  line-height: 1.1;
  color: var(--ink);
}
.checkin-stat-card .csc-lbl {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.scanner-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.scanner-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.scanner-viewport-box {
  position: relative;
  width: 100%;
  max-width: 440px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
  border: 2px dashed var(--water);
  min-height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#reader {
  width: 100% !important;
  border: none !important;
}
#reader video {
  border-radius: 14px;
  object-fit: cover;
  width: 100% !important;
}

.alerta-menor-box {
  background: var(--coral-soft);
  border: 2px solid var(--coral);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.alerta-menor-title {
  color: var(--coral);
  font-weight: 800;
  font-size: 17px;
  font-family: "Bricolage Grotesque", sans-serif;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.alerta-menor-desc {
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  margin-bottom: 12px;
}
.alerta-resp-grid {
  background: rgba(255, 255, 255, 0.7);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
:root[data-theme="dark"] .alerta-resp-grid {
  background: rgba(0, 0, 0, 0.3);
}
.auth-chk-label {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--coral);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}
.auth-chk-label input {
  width: 22px;
  height: 22px;
  min-height: 22px;
  cursor: pointer;
}

.alerta-maior-box {
  background: var(--ok-soft);
  color: var(--ok);
  font-weight: 700;
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.alerta-pagamento-box {
  background: var(--sun-soft);
  border-left: 4px solid var(--sun);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 14px;
  font-size: 14px;
}
.pagamento-ok-box {
  background: var(--ok-soft);
  color: var(--ok);
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 600;
}

.kit-box {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.kit-icon {
  font-size: 28px;
  line-height: 1;
}
.kit-title {
  font-size: 12px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.03em;
}
.kit-tamanho {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
}

.badge-menor {
  background: var(--coral-soft);
  color: var(--coral);
  font-weight: 700;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--coral);
  white-space: nowrap;
}
.badge-maior {
  background: var(--ok-soft);
  color: var(--ok);
  font-weight: 600;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  white-space: nowrap;
}

</style>
</head>
<body>
<div id="login" hidden><div class="lg-card"><h1>Imersos</h1><p>Painel da organização</p>
  <label>Usuário<input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: mateus"></label>
  <label>Senha<input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()"></label>
  <p class="err" id="lgErr"></p>
  <button class="btn" id="lgBtn" onclick="fazerLogin()" style="width:100%">Entrar</button></div></div>
<header class="top">

function extractCupomFromObs(obs){
  if(!obs) return "";
  const m = String(obs).match(/Cupom:\s*([A-Za-z0-9_-]+)/i);
  if(m && m[1] && m[1] !== ".") return normCod(m[1]);
  const allCupons = getCuponsEquipe();
  for(const c of allCupons){
    if(new RegExp('(?:^|[^A-Z0-9])' + c + '(?:[^A-Z0-9]|$)', 'i').test(obs)) return c;
  }
  return "";
}

function isEquipante(a){
  const cupons = getCuponsEquipe();
  if(!cupons.length) return false;
  const obs = (a.obs || "").toUpperCase();
  const cupom = (a.cupom || extractCupomFromObs(a.obs) || "").toUpperCase();
  for(const c of cupons){
    const cNorm = normCod(c);
    if(cupom === cNorm) return true;
    if(new RegExp('(?:^|[^A-Z0-9])' + cNorm + '(?:[^A-Z0-9]|$)', 'i').test(obs)) return true;

}

/* ---------- Regras de pagamento ---------- */
function gerarParcelas(total,n,primeiro,jaPago=0){
  n=Math.max(1,n|0); const base=Math.floor(total/n); const venc0=primeiro||todayISO();
  const ps=[]; for(let i=0;i<n;i++){ps.push({n:i+1,valor:i===n-1?total-base*(n-1):base,venc:addMonths(venc0,i),pago:0,dataPag:""})}
  let resto=jaPago; for(const p of ps){const v=Math.min(resto,p.valor);p.pago=v;if(v>0)p.dataPag=todayISO();resto-=v}
  if(resto>0) ps[ps.length-1].pago+=resto;
  return ps;
}
function statusParcela(p){ if(p.valor>0&&p.pago>=p.valor) return "pago"; if(p.venc&&p.venc<todayISO()) return "atrasado"; if(p.pago>0) return "parcial"; return "pendente"; }
function totais(a){const total=sum(a.parcelas||[],p=>p.valor),pago=sum(a.parcelas||[],p=>p.pago);return{total,pago,falta:Math.max(0,total-pago)}}
function statusAcampante(a){
  const {total,pago}=totais(a);
  if(total>0&&pago>=total) return "pago";
  if((a.parcelas||[]).some(p=>statusParcela(p)==="atrasado")) return "atrasado";
  if(pago>0) return "parcial";
  return "pendente";
}
const ROTULO={pago:"Pago",parcial:"Parcial",pendente:"Pendente",atrasado:"Atrasado",recebido:"Recebido",previsto:"Previsto"};
const pill = s => `<span class="pill ${s}">${ROTULO[s]}</span>`;

function calc(){
  const A=S.acampantes, D=S.despesas, E=S.entradas;
  const recPrev=sum(A,a=>totais(a).total), recRec=sum(A,a=>totais(a).pago);
  const entPrev=sum(E,e=>e.valor), entRec=sum(E,e=>e.recebido?e.valor:0);
  const despPrev=sum(D,d=>d.valor), despPago=sum(D,d=>d.pago?d.valor:0);
  const st={pago:0,parcial:0,pendente:0,atrasado:0}; A.forEach(a=>st[statusAcampante(a)]++);
  const valoresOp=S.config.opcoes.map(o=>o.valor).filter(v=>v>0);
  const media = A.length&&recPrev ? recPrev/A.length : (valoresOp.length? Math.min(...valoresOp):0);
  const precisa = Math.max(0,despPrev-entPrev);
  const minInscritos = media>0 ? Math.ceil(precisa/media) : null;
  return {recPrev,recRec,entPrev,entRec,despPrev,despPago,st,media,minInscritos,
    saldoHoje:recRec+entRec-despPago, saldoProj:recPrev+entPrev-despPrev};
}

/* Utilitário para linha do tempo contínua de inscrições */
function fillDateRange(sortedDates, dateMap){
  if(!sortedDates.length) return { labels: [], daily: [], cumulative: [] };
  const start = new Date(sortedDates[0] + "T00:00:00");
  const today = new Date(todayISO() + "T00:00:00");
  const end = new Date(Math.max(today.getTime(), new Date(sortedDates[sortedDates.length - 1] + "T00:00:00").getTime()));
  const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24));

  const labels = [];
  const daily = [];
  const cumulative = [];
  let acc = 0;

  if(diffDays <= 90 && diffDays >= 0){
    const cur = new Date(start);
    while(cur <= end){
      const iso = cur.toISOString().slice(0, 10);
      const [y, m, d] = iso.split("-");
      labels.push(d + "/" + m);
      const cnt = dateMap[iso] || 0;
      daily.push(cnt);
      acc += cnt;
      cumulative.push(acc);
      cur.setDate(cur.getDate() + 1);
    }
  } else {
    sortedDates.forEach(iso => {
      const [y, m, d] = iso.split("-");
      labels.push(d + "/" + m);
      const cnt = dateMap[iso] || 0;
      daily.push(cnt);
      acc += cnt;
      cumulative.push(acc);
    });
  }
  return { labels, daily, cumulative };
}

    const timeline = fillDateRange(sortedDates, dateMap);

    // Atualiza estatísticas do card
    if(timeline.daily.length){
      const avg = (tot / Math.max(1, timeline.daily.length)).toFixed(1);
      const peak = Math.max(0, ...timeline.daily);
      const elAvg = document.getElementById("valMediaDia");
      if(elAvg) elAvg.textContent = avg;
      const elPico = document.getElementById("valPicoDia");
      if(elPico) elPico.textContent = peak;
    }

    window._chartTempo = new Chart(ctxTempo, {
      type: "line",
      data: {
        labels: timeline.labels.length ? timeline.labels : ["Hoje"],
        datasets: [
          {
            label: "Total acumulado",
            data: timeline.cumulative.length ? timeline.cumulative : [0],
            borderColor: isDark ? "#4FB2BE" : "#16707C",
            backgroundColor: isDark ? "rgba(79, 178, 190, 0.18)" : "rgba(22, 112, 124, 0.12)",
            fill: true,
            tension: 0.3,
            borderWidth: 2.5,
            pointRadius: timeline.labels.length > 25 ? 0 : 3,
            pointHoverRadius: 5,
            yAxisID: "y"
          },
          {
            label: "Novas no dia",
            type: "bar",
            data: timeline.daily.length ? timeline.daily : [0],
            backgroundColor: isDark ? "rgba(240, 189, 61, 0.5)" : "rgba(217, 154, 0, 0.45)",
            borderColor: isDark ? "#F0BD3D" : "#D99A00",
            borderWidth: 1,
            borderRadius: 4,
            yAxisID: "y1"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: {
            grid: { display: false },
            ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8, color: isDark ? "#92A9AD" : "#566C72" }
          },
          y: {
            type: "linear",
            display: true,
            position: "left",
            beginAtZero: true,
            grid: { color: isDark ? "rgba(36,65,73,0.6)" : "rgba(208,223,219,0.5)" },
            ticks: { precision: 0, color: isDark ? "#92A9AD" : "#566C72" }
          },
          y1: {
            type: "linear",
            display: false,
            position: "right",
            beginAtZero: true,
            grid: { drawOnChartArea: false }
          }
        },
        plugins: {
          legend: {
            display: true,
            position: "top",
            labels: {
              boxWidth: 12,
              font: { size: 12 },
              color: isDark ? "#E4EFED" : "#0F2A33"
            }
          },
          tooltip: {
            callbacks: {
              label: function(ctx){
                return " " + ctx.dataset.label + ": " + ctx.raw + " inscritos";
              }
            }
          }
        }
      }
    });
  }

  /* 3. Gráfico Valores Recebidos vs. Pendentes */
  const ctxFin = document.getElementById("chartFinanceiro");
  if(ctxFin){
    if(window._chartFinanceiro) { window._chartFinanceiro.destroy(); window._chartFinanceiro = null; }
    const entTotal = c.recPrev + c.entPrev;
    const jaInsc = c.recRec;
    const jaOutras = c.entRec;
    const pendente = Math.max(0, entTotal - (jaInsc + jaOutras));

    window._chartFinanceiro = new Chart(ctxFin, {
      type: "doughnut",
      data: {
        labels: [
          "Inscrições pagas (Já entrou)",
          "Outras entradas (Já entrou)",
          "Pendente a entrar"
        ],
        datasets: [{
          data: entTotal > 0 ? [jaInsc, jaOutras, pendente] : [0, 0, 1],
          backgroundColor: entTotal > 0 ? [
            isDark ? "#4FB2BE" : "#16707C", // Inscrições
            isDark ? "#6CC28F" : "#2C7A4C", // Outras entradas
            isDark ? "rgba(36,65,73,0.85)" : "#D0DFDB" // Pendente mais suave e discreto
          ] : [isDark ? "#244149" : "#D0DFDB"],
          borderWidth: 2,
          borderColor: isDark ? "#122830" : "#FFFFFF"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: "68%",
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: {
              boxWidth: 12,
              color: isDark ? "#E4EFED" : "#0F2A33",
              font: { size: 11, weight: 600 }
            }
          },
          tooltip: {
            callbacks: {
              label: function(ctx){
                const val = ctx.raw || 0;
                const p = entTotal ? Math.round((val / entTotal) * 100) : 0;
                return " " + ctx.label + ": " + fmt(val) + " (" + p + "%)";
              }
            }
          }
        }
      }
    });
  }
}

  // 4. Grid de Estatísticas Rápidas
  h += `<div class="grid">

  h+= cob.length? `<div class="list">`+cob.slice(0,12).map(({a,p,s})=>`<button class="item" onclick="abrirAcampante('${a.id}')"><span class="name">${esc(a.nome)}</span>

    : `<div class="empty"><strong>Tudo em dia</strong>Nenhuma parcela atrasada ou vencendo nos próximos 15 dias.</div>`;
  h+=`</div>`;

  $("#sec-resumo").innerHTML=h;
  renderCharts();
}

function renderAcampantes(){
  const busca=norm(S.busca);
  let L=S.acampantes.slice().sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome)));
  if(S.filtro==="acampantes") L=L.filter(a=>!isEquipante(a));
  else if(S.filtro==="equipantes") L=L.filter(a=>isEquipante(a));
  else if(S.filtro!=="todos") L=L.filter(a=>statusAcampante(a)===S.filtro);

  if(busca) L=L.filter(a=>norm(a.nome).includes(busca)||String(a.telefone||"").includes(busca)||norm(a.codigo).includes(busca)||norm(a.obs).includes(busca));

  const filtros=[
    {id:"todos", label:"Todos"},
    {id:"acampantes", label:"🏕️ Acampantes"},
    {id:"equipantes", label:"★ Equipantes"},
    {id:"pago", label:"Pagos"},
    {id:"parcial", label:"Parciais"},
    {id:"pendente", label:"Pendentes"},
    {id:"atrasado", label:"Atrasados"}
  ];
  const chips=filtros.map(f=>`<button class="chip" aria-pressed="${S.filtro===f.id}" onclick="setFiltro('${f.id}')">${f.label}</button>`).join("");
  const tot=S.acampantes.reduce((a,x)=>{const t=totais(x);a.t+=t.total;a.p+=t.pago;return a},{t:0,p:0});
  const totEq = S.acampantes.filter(isEquipante).length;
  const totAc = S.acampantes.length - totEq;

  let h=`<div class="toolbar"><input type="search" placeholder="Buscar por nome, telefone, cupom ou código" value="${esc(S.busca)}" oninput="S.busca=this.value;renderAcampantesList()" aria-label="Buscar acampante">
    ${canEdit()?`<button class="btn" onclick="formAcampante()">Adicionar acampante</button><button class="btn ghost" onclick="formImport()">Importar planilha</button>`:""}
    <button class="btn ghost" onclick="exportAcampantes()">Exportar</button></div>
    <div class="chips">${chips}</div>
    <div class="totals">
      <span><b>${S.acampantes.length}</b> inscritos (<b>${totAc}</b> acampantes • <b>${totEq}</b> equipantes)</span>
      <span>Recebido <b style="color:var(--ok)">${fmt(tot.p)}</b></span>
      <span style="font-size:13px;opacity:0.85">Pendente a entrar <b>${fmt(tot.t-tot.p)}</b></span>
    </div>
    <div id="acList"></div>`;
  $("#sec-acampantes").innerHTML=h; renderAcampantesList(L);
}

function renderAcampantesList(L){
  if(!L){
    const busca=norm(S.busca);
    L=S.acampantes.slice().sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome)));
    if(S.filtro==="acampantes") L=L.filter(a=>!isEquipante(a));
    else if(S.filtro==="equipantes") L=L.filter(a=>isEquipante(a));
    else if(S.filtro!=="todos") L=L.filter(a=>statusAcampante(a)===S.filtro);

    if(busca) L=L.filter(a=>norm(a.nome).includes(busca)||String(a.telefone||"").includes(busca)||norm(a.codigo).includes(busca)||String(a.cpf||"").includes(busca)||norm(a.lote||"").includes(busca)||norm(a.obs||"").includes(busca));
  }
  const el=$("#acList"); if(!el)return;
  if(!S.acampantes.length){el.innerHTML=`<div class="empty"><strong>Nenhum acampante ainda</strong>As inscrições feitas pelo site ou adicionadas manualmente aparecerão aqui.</div>`;return}
  if(!L.length){el.innerHTML=`<div class="empty"><strong>Ninguém neste filtro</strong>Tente outro filtro ou termo de busca.</div>`;return}

  el.innerHTML=`<div class="list">`+L.map(a=>{
    const t=totais(a);
    const s=statusAcampante(a);
    const cpfFmt = a.cpf ? a.cpf.replace(/(\\d{3})(\\d{3})(\\d{3})(\\d{2})/, "$1.$2.$3-$4") : "";
    const eq = isEquipante(a);
    const badgeTipo = eq
      ? `<span class="pill equipante" style="font-size:11px">★ Equipante</span>`
      : `<span class="pill acampante" style="font-size:11px">Acampante</span>`;
    const cupCode = a.cupom || extractCupomFromObs(a.obs);

async function addCupom(){
  const codigo=normCod($("#cpCod").value), igreja=$("#cpIgr").value.trim(), tipo=$("#cpTipo").value, raw=$("#cpVal").value;
  const err=t=>$("#cpErr").textContent=t;
  if(codigo.length<3) return err("O código precisa ter pelo menos 3 letras ou números.");
  if(!igreja) return err("Informe o nome da igreja.");
  let valor = tipo==="percent" ? parseInt(String(raw).replace(/\D/g,"")) : parseMoney(raw);
  if(!valor||isNaN(valor)||valor<0) return err(tipo==="percent"?"Digite a porcentagem, ex.: 50.":"Digite o valor, ex.: 400,00.");
  if(tipo==="percent"&&valor>100) return err("A porcentagem vai de 1 a 100.");
  if(S.cupons.some(c=>c.codigo===codigo)) return err("Já existe um cupom com esse código.");
  const row={codigo,igreja,tipo,valor,validade:$("#cpVal2").value||null,ativo:true};
  const {data,error}=await sb.from("cupons").insert(row).select().single();
  if(error){console.error(error);return err("Não foi possível salvar o cupom. Tente de novo.")}
  S.cupons.push(data); document.activeElement?.blur(); renderAjustes(); toast("Cupom "+codigo+" criado");
}
async function toggleCupom(id){const c=S.cupons.find(x=>x.id===id);if(!c)return;
  const {error}=await sb.from("cupons").update({ativo:!c.ativo}).eq("id",id);
  if(error)return falhou(error); c.ativo=!c.ativo; document.activeElement?.blur(); renderAjustes(); toast(c.ativo?"Cupom ativado":"Cupom pausado")}
async function delCupom(id){const c=S.cupons.find(x=>x.id===id);if(!c||!confirm("Remover o cupom "+c.codigo+"? Quem já se inscreveu com ele não é afetado."))return;
  const {error}=await sb.from("cupons").delete().eq("id",id);
  if(error)return falhou(error); S.cupons=S.cupons.filter(x=>x.id!==id); document.activeElement?.blur(); renderAjustes(); toast("Cupom removido")}

function atualizarPlaceholderCupom(){
  const tipo = $("#cpTipoTab")?.value;
  const input = $("#cpValTab");
  if(!input) return;
  if(tipo === "percent") input.placeholder = "Ex.: 20 (para 20%)";
  else if(tipo === "off") input.placeholder = "Ex.: 50,00 (para R$ 50 de desconto)";
  else input.placeholder = "Ex.: 380,00 (preço final)";
}

async function addCupomTab(){
  const err = t => { const el = $("#cpErrTab"); if(el) el.textContent = t; };
  err("");
  const codInput = $("#cpCodTab"), igrInput = $("#cpIgrTab"), tipoInput = $("#cpTipoTab"), valInput = $("#cpValTab"), validadeInput = $("#cpValidadeTab");
  const codigo = normCod(codInput?.value || ""), igreja = (igrInput?.value || "").trim(), tipo = tipoInput?.value || "percent", raw = valInput?.value || "";

  if(codigo.length < 3) return err("O código precisa ter pelo menos 3 letras ou números.");
  if(!igreja) return err("Informe o nome da igreja ou parceiro.");
  let valor = tipo === "percent" ? parseInt(String(raw).replace(/\D/g, "")) : parseMoney(raw);
  if(!valor || isNaN(valor) || valor <= 0) return err(tipo === "percent" ? "Digite a porcentagem (ex.: 20)." : "Digite o valor em reais (ex.: 50,00).");
  if(tipo === "percent" && valor > 100) return err("A porcentagem não pode ser maior que 100%.");
  if(S.cupons && S.cupons.some(c => c.codigo === codigo)) return err("Já existe um cupom com esse código.");

  const row = { codigo, igreja, tipo, valor, validade: validadeInput?.value || null, ativo: true };
  const { data, error } = await sb.from("cupons").insert(row).select().single();
  if(error){ console.error(error); return err("Erro ao salvar no banco: " + error.message); }

  if(!S.cupons) S.cupons = [];
  S.cupons.push(data);
  codInput.value = ""; igrInput.value = ""; valInput.value = ""; if(validadeInput) validadeInput.value = "";
  renderCupons();
  renderAjustes();
  toast("Cupom " + codigo + " criado com sucesso!");
}

async function toggleCupomTab(id){
  const c = S.cupons.find(x => x.id === id); if(!c) return;
  const { error } = await sb.from("cupons").update({ ativo: !c.ativo }).eq("id", id);
  if(error) return falhou(error);
  c.ativo = !c.ativo;
  renderCupons();
  renderAjustes();
  toast(c.ativo ? "Cupom ativado" : "Cupom pausado");
}

async function delCupomTab(id){
  const c = S.cupons.find(x => x.id === id);
  if(!c || !confirm("Tem certeza que deseja remover o cupom " + c.codigo + "?")) return;
  const { error } = await sb.from("cupons").delete().eq("id", id);
  if(error) return falhou(error);
  S.cupons = S.cupons.filter(x => x.id !== id);
  renderCupons();
  renderAjustes();
  toast("Cupom removido");
}

function copiarTexto(txt, btn){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => {
      const old = btn.textContent;
      btn.textContent = "Copiado!";
      setTimeout(() => { btn.textContent = old; }, 1800);
    });
  } else {
    toast("Código: " + txt);
  }
}

function copiarLinkCheckout(codigo, valorCentavos, cpf){
  const origin = window.location.origin.includes('acampimersos.com.br') ? 'https://acampamentoipi.com.br' : window.location.origin;
  const url = origin + "/checkout.html?codigo=" + encodeURIComponent(codigo) + "&valor=" + encodeURIComponent(valorCentavos) + (cpf ? "&cpf=" + encodeURIComponent(cpf) : "");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => {
      toast("Link copiado para a área de transferência!");
    });
  } else {
    prompt("Copie o link abaixo:", url);
  }
}

function mutParcela(id,i,fn){const a=S.acampantes.find(x=>x.id===id);const ps=a.parcelas.map(p=>({...p}));fn(ps[i]);saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id)}

/* Reparte o que falta do total entre as parcelas em aberto (valores em centavos) */
function redistribuir(ps,total){
  const aberto=ps.filter(p=>!(p.valor>0&&p.pago>=p.valor));
  if(!aberto.length) return ps;
  const fechado=sum(ps.filter(p=>!aberto.includes(p)),p=>p.valor);
  let resta=total-fechado;
  if(resta<=0){ const fic=ps.filter(p=>!aberto.includes(p)); fic.forEach((p,k)=>p.n=k+1); return fic; }
  const base=Math.floor(resta/aberto.length); let sobra=resta-base*aberto.length;
  aberto.forEach((p,k)=>{ p.valor=base+(k===aberto.length-1?sobra:0); });
  return ps;
}
function desfazer(id,i){const a=S.acampantes.find(x=>x.id===id);const total=sum(a.parcelas,p=>p.valor);
  let ps=a.parcelas.map(p=>({...p}));ps[i].pago=0;ps[i].dataPag="";ps=redistribuir(ps,total);
  saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);toast("Pagamento desfeito e parcelas recalculadas")}
function parcial(id,i){const v=parseMoney($("#pp"+i).value);if(!v||isNaN(v)||v<0)return toast("Digite o valor pago, ex.: 125,00");
  const a=S.acampantes.find(x=>x.id===id);const total=sum(a.parcelas,p=>p.valor);let ps=a.parcelas.map(p=>({...p}));
  const p=ps[i];p.pago+=v;p.dataPag=todayISO();
  const outrasAbertas=ps.some((q,k)=>k!==i&&!(q.valor>0&&q.pago>=q.valor));
  if(!outrasAbertas){
    if(p.pago>p.valor)p.valor=p.pago;
    saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);
    const extra=sum(ps,q=>q.valor)-total;
    return toast(extra>0?`Registrado. A pessoa pagou ${fmt(extra)} a mais que o total`:"Pagamento registrado")}
  p.valor=p.pago;ps=redistribuir(ps,total);
  const extra=sum(ps,q=>q.pago)-total;
  saveDoc("acampantes",id,{...strip(a),parcelas:ps});abrirAcampante(id);
  toast(extra>0?`Registrado. A pessoa pagou ${fmt(extra)} a mais que o total`:"Pagamento registrado e parcelas recalculadas")}

/* ---------- Importação ---------- */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||""; const cand=[";",",","\t"]; const dl=cand.sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true; else if(ch===dl){row.push(cur);cur=""} else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""} else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function formImport(){
  openDlg("Importar inscrições",`<p class="note" style="margin:0 0 12px">Exporte as respostas do formulário (Google Forms, planilha) e cole aqui, com a linha de títulos. O sistema procura colunas de nome, telefone ou WhatsApp, idade, responsável e forma de pagamento.</p>

let IMPORT=[];
function matchOpcao(v){const n=norm(v);const ops=S.config.opcoes;if(!n)return ops[0];
  let o=ops.find(o=>norm(o.nome)===n)||ops.find(o=>n.includes(norm(o.nome))&&norm(o.nome).length>1);if(o)return o;
  if(n.includes("vista"))return ops.find(o=>o.parcelas===1)||ops[0];
  const m=n.match(/(\d+)\s*(x|vez|parc)/);if(m)return ops.find(o=>o.parcelas===+m[1])||ops[0];return ops[0]}
function previewImport(){

    .filter(x=>x.nome&&!existentes.has(norm(x.nome)));
  const dup=rows.length-1-IMPORT.length;
  $("#iPrev").innerHTML=IMPORT.length?`<div class="preview"><table><tr><th>Nome</th><th>WhatsApp</th><th>Pagamento</th></tr>${IMPORT.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.telefone)}</td><td>${esc(x.o.nome)}</td></tr>`).join("")}</table></div>`:"";
  if(dup>0) $("#iErr").textContent=`${dup} linha(s) ignorada(s): sem nome ou já cadastrada(s).`;
  $("#iBtn").disabled=!IMPORT.length; $("#iBtn").textContent=`Importar ${IMPORT.length} acampante(s)`;

const csvCell = v => {const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const reais = c => ((c||0)/100).toFixed(2).replace(".",",");
function baixar(nome,linhas){
  const data="\ufeff"+linhas.map(r=>r.map(csvCell).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  const el=document.createElement("a"); el.href=url; el.download=nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500); toast("Arquivo baixado");
}
function exportAcampantes(){
  const L=[["Nome","Tipo","Cupom","WhatsApp","E-mail","Idade","Responsável","Forma","Total","Pago","Falta","Situação"]];

    const tipo = isEquipante(a) ? "Equipante" : "Acampante";
    const cup = a.cupom || extractCupomFromObs(a.obs) || "";
    L.push([a.nome,tipo,cup,a.telefone,a.email||"",a.idade||"",a.responsavel,a.opcaoNome,reais(t.total),reais(t.pago),reais(t.falta),ROTULO[statusAcampante(a)]]);
  });
  baixar("acampantes.csv",L);
}
function exportFinanceiro(){
  const L=[["Tipo","Descrição","Categoria","Data","Valor","Situação"]];
  S.acampantes.forEach(a=>(a.parcelas||[]).forEach(p=>L.push(["Inscrição",`${a.nome} (parcela ${p.n}/${a.parcelas.length})`,"Inscrições",fmtDate(p.venc),reais(p.valor),ROTULO[statusParcela(p)]])));
  S.entradas.forEach(e=>L.push(["Entrada",e.descricao,e.categoria,fmtDate(e.data),reais(e.valor),e.recebido?"Recebido":"Previsto"]));
  S.despesas.forEach(d=>L.push(["Gasto",d.descricao,d.categoria,fmtDate(d.data),"-"+reais(d.valor),d.pago?"Pago":"Previsto"]));
  baixar("financeiro.csv",L);
}

/* ---------- Lógica e Renderização de Check-in ---------- */
let filtroCheckin = "todos"; // 'todos' | 'pendente' | 'checkin' | 'menor'
let buscaCheckin = "";
let html5QrScanner = null;
let isScanning = false;
let lastScannedText = "";
let lastScannedTime = 0;

function isMenor(a){
  if(!a) return false;
  if(a.idade !== null && a.idade !== undefined && a.idade !== ""){
    const n = Number(a.idade);
    if(!isNaN(n) && n > 0) return n < 18;
  }
  if(a.nascimento){
    const parts = String(a.nascimento).split("-");
    if(parts.length === 3){
      const campDate = new Date(2027, 1, 5); // 05/02/2027
      const birthDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      let age = campDate.getFullYear() - birthDate.getFullYear();
      const m = campDate.getMonth() - birthDate.getMonth();
      if(m < 0 || (m === 0 && campDate.getDate() < birthDate.getDate())) age--;
      if(!isNaN(age)) return age < 18;
    }
  }
  if(a.responsavel && a.responsavel.trim().length > 1) return true;
  if(a.responsavelTel && a.responsavelTel.trim().length > 1) return true;
  if(a.obs && /(Resp1|Resp2|Respons[aá]vel|Autoriza[çc][aã]o)/i.test(a.obs)) return true;
  return false;
}

function getIdadeText(a){
  if(a.idade !== null && a.idade !== undefined && a.idade !== ""){
    return a.idade + " anos";
  }
  if(a.nascimento){
    const parts = String(a.nascimento).split("-");
    if(parts.length === 3){
      const campDate = new Date(2027, 1, 5);
      const birthDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      let age = campDate.getFullYear() - birthDate.getFullYear();
      const m = campDate.getMonth() - birthDate.getMonth();
      if(m < 0 || (m === 0 && campDate.getDate() < birthDate.getDate())) age--;
      if(!isNaN(age) && age > 0) return age + " anos";
    }
  }
  return "Idade não informada";
}

function getCheckinData(a){
  if(!a) return null;
  const key = a.codigo || a.id;
  if(S.config && S.config.checkins && S.config.checkins[key]){
    return S.config.checkins[key];
  }
  if(a.obs){
    const m = a.obs.match(/\[CHECKIN:\s*([^\|\]]+)(?:\|\s*por:\s*([^\]\|]+))?(?:\|\s*autorizacao:\s*([^\]]+))?\]/i);
    if(m){
      return {
        data: m[1].trim(),
        por: (m[2] || "admin").trim(),
        autorizacaoMenor: (m[3] || "").toUpperCase().includes("OK")
      };
    }
  }
  return null;
}

function isCheckedIn(a){
  return Boolean(getCheckinData(a));
}

function fmtCheckinData(iso){
  if(!iso) return "data desconhecida";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch(e){
    return iso;
  }
}

function playCheckinBeep(success = true){
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if(success){
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.18);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } else {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.22);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    }
  } catch(e) {}
}

function extrairCodigoInscricao(raw){
  if(!raw) return "";
  const s = String(raw).trim();
  try {
    if(s.startsWith("http://") || s.startsWith("https://")){
      const u = new URL(s);
      const cod = u.searchParams.get("codigo") || u.searchParams.get("code") || u.searchParams.get("c");
      if(cod) return cod.trim().toUpperCase();
      if(u.hash){
        const mHash = u.hash.match(/[?&]c(?:odigo)?=([A-Za-z0-9_-]+)/i);
        if(mHash) return mHash[1].trim().toUpperCase();
      }
    }
  } catch(e) {}
  const mImr = s.match(/\b(IMR[-_]?[A-Z0-9]{3,8})\b/i);
  if(mImr) return mImr[1].toUpperCase();
  return s.toUpperCase();
}

function processarCodigoLido(rawText){
  const codBuscado = extrairCodigoInscricao(rawText);
  const rawNum = rawText.replace(/\D/g, "");
  const a = S.acampantes.find(x => {
    if(x.codigo && x.codigo.toUpperCase() === codBuscado) return true;
    if(x.id && x.id === rawText) return true;
    if(rawNum && rawNum.length === 11 && x.cpf && x.cpf.replace(/\D/g, "") === rawNum) return true;
    if(norm(x.nome) === norm(rawText)) return true;
    return false;
  });

  if(a){
    playCheckinBeep(true);
    abrirCheckinModal(a.id);
  } else {
    playCheckinBeep(false);
    toast("QR Code lido: '" + rawText + "', mas nenhuma inscrição foi encontrada.");
  }
}

async function iniciarCamera(){
  const readerEl = document.getElementById("reader");
  const placeholder = document.getElementById("scannerPlaceholder");
  if(!readerEl) return;
  if(typeof Html5Qrcode === "undefined"){
    toast("Biblioteca de câmera carregando. Aguarde 2 segundos e tente de novo.");
    return;
  }
  if(isScanning) return;

  try {
    if(!html5QrScanner){
      html5QrScanner = new Html5Qrcode("reader");
    }

    try {
      const devices = await Html5Qrcode.getCameras();
      const select = document.getElementById("cameraSelect");
      if(select && devices && devices.length){
        select.innerHTML = devices.map(d => '<option value="' + d.id + '">' + (d.label || 'Câmera ' + d.id) + '</option>').join("");
        select.style.display = devices.length > 1 ? "block" : "none";
      }
    } catch(eDevices) {
      console.warn("Erro ao listar câmeras:", eDevices);
    }

    const select = document.getElementById("cameraSelect");
    const cameraId = select && select.value ? select.value : { facingMode: "environment" };

    if(placeholder) placeholder.style.display = "none";
    readerEl.style.display = "block";

    await html5QrScanner.start(
      cameraId,
      { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 },
      (decodedText) => {
        const now = Date.now();
        if(decodedText === lastScannedText && now - lastScannedTime < 3000){
          return;
        }
        lastScannedText = decodedText;
        lastScannedTime = now;
        processarCodigoLido(decodedText);
      },
      () => {}
    );

    isScanning = true;
    atualizarBotoesCamera(true);
  } catch(err) {
    console.error("Falha ao abrir câmera:", err);
    toast("Não foi possível acessar a câmera. Verifique a permissão do navegador.");
    isScanning = false;
    atualizarBotoesCamera(false);
    if(placeholder) placeholder.style.display = "block";
  }
}

async function pararCamera(){
  if(html5QrScanner && isScanning){
    try {
      await html5QrScanner.stop();
    } catch(e) {
      console.warn("Aviso ao parar câmera:", e);
    }
    isScanning = false;
    atualizarBotoesCamera(false);
    const placeholder = document.getElementById("scannerPlaceholder");
    if(placeholder) placeholder.style.display = "block";
  }
}

async function trocarCamera(deviceId){
  if(!deviceId) return;
  if(isScanning){
    await pararCamera();
    setTimeout(iniciarCamera, 300);
  }
}

function atualizarBotoesCamera(ativa){
  const btnStart = document.getElementById("btnStartScan");
  const btnStop = document.getElementById("btnStopScan");
  const badge = document.getElementById("scannerStatusBadge");
  if(btnStart) btnStart.style.display = ativa ? "none" : "inline-flex";
  if(btnStop) btnStop.style.display = ativa ? "inline-flex" : "none";
  if(badge){
    badge.className = ativa ? "pill pago" : "pill pendente";
    badge.textContent = ativa ? "● Câmera Ativa" : "○ Câmera Desligada";
  }
}

function getCheckinFiltrados(){
  let list = S.acampantes.slice();
  if(filtroCheckin === "pendente"){
    list = list.filter(a => !isCheckedIn(a));
  } else if(filtroCheckin === "checkin"){
    list = list.filter(a => isCheckedIn(a));
  } else if(filtroCheckin === "menor"){
    list = list.filter(a => isMenor(a));
  }

  if(buscaCheckin){
    const b = norm(buscaCheckin);
    const bRaw = buscaCheckin.replace(/\D/g, "");
    list = list.filter(a => {
      return norm(a.nome).includes(b) ||
        (a.codigo && a.codigo.toUpperCase().includes(buscaCheckin.toUpperCase())) ||
        (bRaw && bRaw.length >= 4 && a.cpf && a.cpf.replace(/\D/g, "").includes(bRaw)) ||
        (bRaw && bRaw.length >= 4 && a.telefone && a.telefone.replace(/\D/g, "").includes(bRaw)) ||
        (a.responsavel && norm(a.responsavel).includes(b));
    });
  }

  return list;
}

        <div style="font-size:12px;margin-top:2px">Registrado em ${fmtCheckinData(checkData?.data)} por <b>${esc(checkData?.por || 'admin')}</b>${checkData?.autorizacaoMenor ? ' (com autorização)' : ''}.</div>
      </div>
    ` : ''}

    <div class="form-actions" style="margin-top:20px;gap:8px">
      ${checked ? `
        <button class="btn danger" onclick="desfazerCheckin('${a.id}')">Desfazer Check-in</button>
      ` : `
        <button class="btn" style="background:var(--ok);font-size:16px;padding:12px 22px" onclick="confirmarCheckin('${a.id}')">
          ✓ Confirmar Check-in Agora
        </button>
      `}
      <span class="spacer"></span>
      ${a.codigo ? `<button class="btn ghost small" onclick="reenviarEmailModal('${esc(a.codigo)}')">📧 Reenviar E-mail c/ QR Code</button>` : ''}
      <button class="btn ghost small" onclick="closeDlg()">Fechar</button>
    </div>
  `;

  openDlg(checked ? ("Check-in · " + a.nome) : ("Validar Check-in · " + a.nome), html);
}

async function confirmarCheckin(id){
  const a = S.acampantes.find(x => x.id === id);
  if(!a) return toast("Participante não encontrado.");

  const chkTermo = document.getElementById("chkTermoMenor");
  const termoMenor = chkTermo ? chkTermo.checked : false;

  if(isMenor(a) && chkTermo && !chkTermo.checked){
    if(!confirm("ATENÇÃO: O Termo de Autorização dos responsáveis NÃO foi marcado como entregue/conferido.\n\nDeseja prosseguir com o Check-in mesmo sem a conferência do termo?")){
      return;
    }
  }

  const key = a.codigo || a.id;
  const agora = new Date().toISOString();
  const por = S.adminEmail ? S.adminEmail.split("@")[0] : "admin";

  if(!S.config.checkins) S.config.checkins = {};
  S.config.checkins[key] = {
    data: agora,
    por: por,
    autorizacaoMenor: termoMenor
  };

  let obsAtual = a.obs || "";
  obsAtual = obsAtual.replace(/\[CHECKIN:[^\]]+\]/g, "").trim();
  a.obs = (obsAtual ? obsAtual + " " : "") + "[CHECKIN: " + agora + " | por: " + por + (termoMenor ? " | autorizacao: OK" : "") + "]";

  playCheckinBeep(true);
  toast("Check-in de " + a.nome + " realizado com sucesso!");
  closeDlg();

  await Promise.all([
    saveDoc("config", "main", S.config),
    saveDoc("acampantes", a.id, a)
  ]);

  renderCheckin();
}

async function desfazerCheckin(id){
  const a = S.acampantes.find(x => x.id === id);
  if(!a) return toast("Participante não encontrado.");
  if(!confirm("Deseja realmente desfazer o check-in de " + a.nome + "?")) return;

  const key = a.codigo || a.id;
  if(S.config && S.config.checkins && S.config.checkins[key]){
    delete S.config.checkins[key];
  }

  if(a.obs){
    a.obs = a.obs.replace(/\[CHECKIN:[^\]]+\]/g, "").trim();
  }

  toast("Check-in de " + a.nome + " cancelado.");
  closeDlg();

  await Promise.all([
    saveDoc("config", "main", S.config),
    saveDoc("acampantes", a.id, a)
  ]);

  renderCheckin();
}

async function reenviarEmailModal(codigo){
  if(!codigo) return toast("Código da inscrição não encontrado.");
  toast("Enviando e-mail com QR Code...");
  try {
    const res = await fetch("/api/send-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      toast("E-mail com QR Code enviado com sucesso!");
    } else {
      toast(data.error || "Não foi possível enviar o e-mail.");
    }
  } catch(e) {
    console.error(e);
    toast("Falha de rede ao solicitar envio do e-mail.");
  }
}


/* ---------- Lógica e Renderização de Repasses de Igrejas e Subsídios ---------- */
function isCupomEquipeOuComissao(c){
  if(!c) return false;
  const cod = normCod(c.codigo || "");
  if(cod.includes("COMISSAO") || cod.includes("EQUIPE")) return true;
  const cuponsEq = getCuponsEquipe();
  return cuponsEq.includes(cod);
}

function getPrecoBaseInscricao(){
  if(S.config && S.config.opcoes && S.config.opcoes[0] && S.config.opcoes[0].valor){
    return S.config.opcoes[0].valor;
  }
  return 45000;
}

function calcularDescontoUnitario(c, precoBase){
  if(c.tipo === "percent") return Math.round(precoBase * c.valor / 100);
  if(c.tipo === "off") return c.valor;
  if(c.tipo === "price") return Math.max(0, precoBase - c.valor);
  return 0;
}

function getEntradasRepasse(){
  return S.entradas.filter(e => {
    const cat = e.categoria || "";
    const obs = (e.obs || "").toUpperCase();
    return cat === "Repasse de Igreja" || cat === "Subsídio de Inscrição" || obs.includes("REPASSE");
  });
}

function renderRepasses(){
  const sec = document.getElementById("sec-repasses");
  if(!sec) return;

  const repasses = getEntradasRepasse();
  const totRepasses = sum(repasses, x => x.valor);
  const recRepasses = sum(repasses, x => x.recebido ? x.valor : 0);
  const pendRepasses = Math.max(0, totRepasses - recRepasses);

  // Cupons elegíveis para sugestão (exceto COMISSAO27 / equipe)
  const todosCupons = S.cupons || [];
  const cuponsIgreja = todosCupons.filter(c => !isCupomEquipeOuComissao(c));

  const precoBase = getPrecoBaseInscricao();

  // Mapeia estatísticas por cupom
  let totalInscricoesSubsidiadas = 0;
  let totalEstimadoTodosCupons = 0;

  const dadosCupons = cuponsIgreja.map(c => {
    const codNorm = normCod(c.codigo);
    const inscritos = S.acampantes.filter(a => {
      if(isEquipante(a)) return false;
      const cupomInsc = extractCupomFromObs(a.obs);
      if(cupomInsc === codNorm) return true;
      if(c.igreja && c.igreja.length > 2 && norm(a.obs || "").includes(norm(c.igreja))) return true;
      return false;
    });

    const descUn = calcularDescontoUnitario(c, precoBase);
    const subtotalSugerido = inscritos.length * descUn;
    totalInscricoesSubsidiadas += inscritos.length;
    totalEstimadoTodosCupons += subtotalSugerido;

    // Procura entradas já lançadas para este cupom / igreja
    const entradasDoCupom = S.entradas.filter(e => {
      const obs = (e.obs || "").toUpperCase();
      const desc = norm(e.descricao);
      return obs.includes(codNorm) || desc.includes(norm(c.codigo)) || (c.igreja && desc.includes(norm(c.igreja)));
    });

    const jaLancado = sum(entradasDoCupom, x => x.valor);
    const jaRecebido = sum(entradasDoCupom, x => x.recebido ? x.valor : 0);
    const saldoPendente = Math.max(0, subtotalSugerido - jaLancado);

    return {
      cupom: c,
      inscritos,
      descUn,
      subtotalSugerido,
      jaLancado,
      jaRecebido,
      saldoPendente,
      entradasDoCupom
    };
  });

  let h = `
    <div class="block" style="margin-top:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">
        <div>
          <h2>Repasses de Igrejas e Subsídios</h2>
          <p class="hint" style="margin:2px 0 0">
            Controle e registre as contribuições e repasses das igrejas que subsidiaram inscrições com cupons de desconto ou doações diretas.
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="formNovoRepasse()">+ Novo Repasse de Igreja</button>
          <button class="btn ghost" onclick="goTab('cupons')">Ver Cupons</button>
        </div>
      </div>

      <!-- Resumo Financeiro dos Repasses -->
      <div class="grid" style="margin-bottom:20px">
        <div class="stat">
          <h3>Total em Repasses Lançados</h3>
          <div class="big" style="color:var(--ink)">${fmt(totRepasses)}</div>
          <div class="sub">${repasses.length} lançamento(s) em entradas</div>
        </div>
        <div class="stat">
          <h3>Já Recebido em Caixa</h3>
          <div class="big" style="color:var(--ok)">${fmt(recRepasses)}</div>
          <div class="sub">valor confirmado e pago pelas igrejas</div>
        </div>
        <div class="stat">
          <h3>A Receber (Previsto)</h3>
          <div class="big" style="color:var(--water)">${fmt(pendRepasses)}</div>
          <div class="sub">repasses combinados a entrar</div>
        </div>
        <div class="stat">
          <h3>Inscrições com Cupom de Igreja</h3>
          <div class="big" style="color:var(--sun)">${totalInscricoesSubsidiadas}</div>
          <div class="sub">total de ${fmt(totalEstimadoTodosCupons)} em descontos aplicados</div>
        </div>
      </div>

      <!-- Bloco de Sugestões de Repasses por Cupom -->
      <div style="margin-bottom:24px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div>
            <h3 style="font-size:19px;margin:0">💡 Sugestões de Repasses pelos Cupons das Igrejas</h3>
            <p class="hint" style="margin:2px 0 0">
              Calculado automaticamente a partir dos cupons ativos utilizados pelos participantes (excluídos cupons da comissão).
            </p>
          </div>
        </div>`;

  if(!dadosCupons.length){
    h += `<div class="empty"><strong>Nenhum cupom de igreja encontrado</strong>Cadastre cupons na aba <b>Cupons</b> para que o sistema gere sugestões automáticas de repasses.</div>`;
  } else {
    h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px">` +
      dadosCupons.map(d => {
        const c = d.cupom;
        const totalEstimado = d.subtotalSugerido;
        const temInscritos = d.inscritos.length > 0;
        const fullyLaunched = d.jaLancado >= totalEstimado && totalEstimado > 0;
        const partial = d.jaLancado > 0 && d.jaLancado < totalEstimado;

        let statusBadge = "";
        if(fullyLaunched){
          statusBadge = `<span class="pill pago">✓ Repasse 100% Lançado (${fmt(d.jaRecebido)} recebido)</span>`;
        } else if(partial){
          statusBadge = `<span class="pill parcial">Parcial: ${fmt(d.jaLancado)} lançado (falta ${fmt(d.saldoPendente)})</span>`;
        } else if(temInscritos){
          statusBadge = `<span class="pill atrasado" style="background:var(--sun-soft);color:var(--ink)">Aguardando Lançamento (${fmt(totalEstimado)})</span>`;
        } else {
          statusBadge = `<span class="pill pendente">Nenhuma inscrição ainda</span>`;
        }

        const nomesAbrev = d.inscritos.map(a => esc(a.nome.split(" ")[0])).slice(0, 5).join(", ");
        const mais = d.inscritos.length > 5 ? ` e mais ${d.inscritos.length - 5}` : "";

        return `
          <div class="panel" style="padding:16px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);border-radius:14px">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
                <div>
                  <b style="font-size:16px;color:var(--ink)">${esc(c.igreja || "Igreja Parceira")}</b>
                  <div style="margin-top:2px">
                    <span style="font-family:monospace;font-size:12px;font-weight:700;background:var(--water-soft);color:var(--water-2);padding:2px 7px;border-radius:4px">
                      ${esc(c.codigo)}

                    <span style="font-size:12px;color:var(--muted);margin-left:6px">${cupomDesc(c)}</span>
                  </div>
                </div>
                <div>${statusBadge}</div>
              </div>

              <div style="background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="color:var(--muted)">Inscrições que usaram o cupom:</span>
                  <b>${d.inscritos.length} participante(s)</b>
                </div>
                ${d.inscritos.length ? `
                  <div style="font-size:12px;color:var(--muted);margin-bottom:6px">
                    (${nomesAbrev}${mais})
                  </div>
                ` : ''}
                <div style="display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:4px">
                  <span style="color:var(--muted)">Subsídio total sugerido:</span>
                  <b style="font-size:15px;color:var(--ink)">${fmt(totalEstimado)}</b>
                </div>
              </div>
            </div>

            <div style="margin-top:10px;display:flex;justify-content:flex-end">
              <button class="btn small" onclick="lancarRepasseSugerido('${c.id}')" style="width:100%">
                ${fullyLaunched ? 'Lançar Novo Repasse Adicional' : '+ Lançar Repasse desta Igreja'}
              </button>
            </div>
          </div>
        `;
      }).join("") + `</div>`;
  }
  h += `</div>`;

  // Bloco de Repasses Já Lançados
  h += `
    <div style="margin-top:28px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div>
          <h3 style="font-size:19px;margin:0">🏛️ Repasses e Ajudas de Igrejas Já Lançados</h3>
          <p class="hint" style="margin:2px 0 0">
            Registrados na tabela de entradas e integrados com o fluxo de caixa.
          </p>
        </div>
      </div>`;

  if(!repasses.length){
    h += `<div class="empty"><strong>Nenhum repasse de igreja registrado ainda</strong>Clique em "+ Novo Repasse de Igreja" ou lance uma das sugestões acima.</div>`;
  } else {
    h += `<div class="list">` + repasses.map(e => {
      const st = e.recebido ? "recebido" : "previsto";
      return `
        <div class="item" style="cursor:default">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <b style="font-size:15px">${esc(e.descricao)}</b>
              <span class="pill" style="background:var(--water-soft);color:var(--ink);font-size:11px">${esc(e.categoria)}</span>
              ${pill(st)}
            </div>
            <div class="meta" style="margin-top:4px">
              Data: <b>${fmtDate(e.data)}</b> ${e.obs ? `· Obs: ${esc(e.obs)}` : ''}
            </div>
          </div>
          <div class="right">
            <div class="amount" style="font-size:17px;color:${e.recebido ? 'var(--ok)' : 'var(--ink)'}">${fmt(e.valor)}</div>
            <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
              ${!e.recebido ? `<button class="btn small" style="padding:4px 8px;font-size:12px" onclick="marcarRepasseRecebido('${e.id}')">Marcar Recebido</button>` : ''}
              <button class="btn ghost small" style="padding:4px 8px;font-size:12px" onclick="formMov('entradas','${e.id}')">Editar</button>
              <button class="btn danger small" style="padding:4px 8px;font-size:12px" onclick="excluirMov('entradas','${e.id}')">Excluir</button>
            </div>
          </div>
        </div>
      `;
    }).join("") + `</div>`;
  }

  h += `</div></div>`;
  sec.innerHTML = h;
}

function lancarRepasseSugerido(cupomId){
  const c = (S.cupons || []).find(x => x.id === cupomId);
  if(!c) return toast("Cupom não encontrado.");

  const precoBase = getPrecoBaseInscricao();
  const codNorm = normCod(c.codigo);

  const inscritos = S.acampantes.filter(a => {
    if(isEquipante(a)) return false;
    const cupomInsc = extractCupomFromObs(a.obs);
    if(cupomInsc === codNorm) return true;
    if(c.igreja && c.igreja.length > 2 && norm(a.obs || "").includes(norm(c.igreja))) return true;
    return false;
  });

  const descUn = calcularDescontoUnitario(c, precoBase);
  const subtotalSugerido = inscritos.length * descUn;

  const entradasDoCupom = S.entradas.filter(e => {
    const obs = (e.obs || "").toUpperCase();
    const desc = norm(e.descricao);
    return obs.includes(codNorm) || desc.includes(norm(c.codigo)) || (c.igreja && desc.includes(norm(c.igreja)));
  });

  const jaLancado = sum(entradasDoCupom, x => x.valor);
  const saldoPendente = Math.max(0, subtotalSugerido - jaLancado);
  const valorSugerido = saldoPendente > 0 ? saldoPendente : (subtotalSugerido > 0 ? subtotalSugerido : descUn);

  const nomes = inscritos.map(a => a.nome).slice(0, 10).join(", ");
  const descPadrao = `Repasse ${c.igreja || c.codigo} - Cupom ${c.codigo}` + (inscritos.length ? ` (${inscritos.length} inscrições)` : "");
  const obsPadrao = `[REPASSE_IGREJA: ${c.igreja || c.codigo} | CUPOM: ${c.codigo}]` + (nomes ? ` Inscrições: ${nomes}` : "");

  formRepasseModal({
    descricao: descPadrao,
    categoria: "Repasse de Igreja",
    valor: valorSugerido,
    data: todayISO(),
    recebido: true,
    obs: obsPadrao
  });
}

      <textarea id="repObs" style="min-height:70px" ${ro ? "disabled" : ""}>${esc(prefill.obs)}</textarea>

      <div class="form-actions" style="margin-top:14px">

async function salvarRepasse(){
  const descricao = $("#repDesc").value.trim();
  if(!descricao) return $("#repErr").textContent = "Informe a descrição do repasse.";

  const valor = parseMoney($("#repVal").value);
  if(!valor || isNaN(valor) || valor <= 0) return $("#repErr").textContent = "Informe o valor do repasse (ex: 500,00).";

  const categoria = $("#repCat").value;
  const data = $("#repData").value || todayISO();
  const recebido = $("#repOk").checked;
  const obs = $("#repObs").value.trim();

  const novaEntrada = {
    descricao,
    categoria,
    valor,
    data,
    recebido,
    obs
  };

  await saveDoc("entradas", newId(), novaEntrada);
  closeDlg();
  toast("Repasse registrado nas entradas com sucesso!");
  renderRepasses();
}

async function marcarRepasseRecebido(id){
  const e = S.entradas.find(x => x.id === id);
  if(!e) return;
  e.recebido = true;
  await saveDoc("entradas", id, e);
  toast("Repasse marcado como recebido!");
  renderRepasses();
}


/* ---------- Navegação ---------- */
function goTab(t){
  if(S.tab === "checkin" && t !== "checkin"){
    pararCamera();
  }
  S.tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="sec-"+t);
  window.scrollTo({top:0});
  if(t==="resumo") renderCharts();
  if(t==="checkin") renderCheckin();
  if(t==="repasses") renderRepasses();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.tab)));
init();
