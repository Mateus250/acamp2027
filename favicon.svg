<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#021722"/>
    </linearGradient>

    <!-- Gradiente do Sol Dourado -->
    <linearGradient id="sunGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#FFD27A"/>
      <stop offset="100%" stop-color="#E8A93C"/>
    </linearGradient>

    <!-- Gradiente da Onda Frontal (Ciano / Turquesa Vibrante) -->
    <linearGradient id="waveFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradiente da Onda Média (Azul-petróleo) -->
    <linearGradient id="waveMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>

    <!-- Gradiente da Onda Profunda -->
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>

    <!-- Filtro de brilho sutil -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Squircle / App Icon Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#164E63" stroke-width="4"/>

  <!-- Disco Solar Dourado com Raios de Luz -->
  <g transform="translate(260, 250)">
    <!-- Raios de Luz Penetrando a Água -->
    <g opacity="0.45">
      <polygon points="0,0 -80,-200 -20,-205" fill="#FFEAA7"/>
      <polygon points="0,0 20,-205 80,-195" fill="#FFEAA7"/>
      <polygon points="0,0 120,-170 170,-130" fill="#FFEAA7"/>
      <polygon points="0,0 180,-90 205,-40" fill="#FFEAA7"/>
      <polygon points="0,0 195,10 205,60" fill="#FFEAA7"/>
    </g>
    <!-- Sol Principal -->
    <circle cx="20" cy="0" r="145" fill="url(#sunGrad)" filter="url(#softGlow)"/>
  </g>

  <!-- Cruz Central (Silhueta na Luz) -->
  <g fill="#082F49" opacity="0.95">
    <!-- Haste Vertical -->
    <rect x="254" y="160" width="28" height="175" rx="5"/>
    <!-- Haste Horizontal -->
    <rect x="220" y="200" width="96" height="26" rx="5"/>
  </g>

  <!-- Camadas da Grande Onda Envolvente (Mergulho / Imersão) -->
  <!-- Onda de Fundo -->
  <path d="M120 405 C 130 330, 185 240, 270 205 C 315 185, 360 205, 345 255 C 330 300, 280 340, 240 370 C 190 405, 145 408, 120 405 Z" fill="url(#waveDeep)" opacity="0.6"/>

  <!-- Onda Intermediária com Curvatura Orgânica -->
  <path d="M100 415 C 110 320, 150 200, 260 150 C 310 128, 340 145, 325 185 C 305 235, 230 265, 205 325 C 185 370, 215 415, 310 425 C 230 450, 130 450, 100 415 Z" fill="url(#waveMid)"/>

  <!-- Crista da Onda Frontal (Ciano Vibrante) -->
  <path d="M90 400 C 100 280, 160 170, 265 140 C 315 125, 332 140, 310 175 C 285 215, 220 240, 195 305 C 170 370, 215 400, 290 408 C 365 415, 410 380, 435 340 C 420 405, 340 445, 250 445 C 150 445, 100 435, 90 400 Z" fill="url(#waveFront)"/>

  <!-- Espuma e Brilho na Crista -->
  <path d="M260 142 C 285 135, 310 138, 320 150 C 298 160, 275 162, 255 178 C 240 190, 230 215, 215 240 C 205 220, 220 185, 245 160 C 250 152, 255 145, 260 142 Z" fill="#F0FDFA" opacity="0.85"/>

  <!-- Gotículas / Bolhas de Imersão -->
  <circle cx="340" cy="148" r="7" fill="#CCFBF1" opacity="0.9"/>
  <circle cx="365" cy="172" r="5" fill="#CCFBF1" opacity="0.8"/>
  <circle cx="165" cy="235" r="4.5" fill="#A5F3FC" opacity="0.7"/>
  <circle cx="145" cy="270" r="3.5" fill="#A5F3FC" opacity="0.6"/>
</svg>